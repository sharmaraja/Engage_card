<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding Celebration</title>
    <style>
        :root {
            --primary-color: #5c4033;
            --accent-color: #d4af37;
            --bg-color: #fdfbf7;
            --text-color: #333333;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .hero-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .details {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        /* Countdown Timer Styling */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .countdown-box {
            background: var(--bg-color);
            padding: 15px 20px;
            border-radius: 8px;
            min-width: 60px;
            border: 1px solid #e0dcd0;
        }
        .countdown-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        .countdown-box label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #666;
        }
        .map-btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .map-btn:hover {
            background-color: var(--accent-color);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <p class="subtitle">Together with their families</p>
        <h1>Vaishali & Rajat</h1>
        <p class="details">Invite you to celebrate their engagement day</p>

        <!-- Replace with your own image URL -->
        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80" alt="Couple photo" class="hero-img">

        <div class="details">
            <p><strong>Date:</strong> November 28, 2026</p>
            <p><strong>Time:</strong> 12:00 PM Onwards</p>
            <p><strong>Location:</strong> Ashiyana Residency, Lucknow</p>
        </div>

        <h3>Countdown to the Big Day</h3>
        <div class="countdown-container">
            <div class="countdown-box"><span id="days">0</span><label>Days</label></div>
            <div class="countdown-box"><span id="hours">0</span><label>Hours</label></div>
            <div class="countdown-box"><span id="minutes">0</span><label>Minutes</label></div>
            <div class="countdown-box"><span id="seconds">0</span><label>Seconds</label></div>
        </div>

        <!-- Replace href with your Google Maps location link -->
        <a href="https://maps.app.goo.gl/tWC3TUfYP1J17KE17" target="_blank" class="map-btn">View Location on Map</a>
    </div>

    <script>
        // Set your wedding date and time here (YYYY-MM-DDTHH:MM:SS)
        const weddingDate = new Date("2026-11-28T12:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            if (distance < 0) {
                document.getElementById("days").innerText = "0";
                document.getElementById("hours").innerText = "0";
                document.getElementById("minutes").innerText = "0";
                document.getElementById("seconds").innerText = "0";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
