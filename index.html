    <style>
        :root {
            --maroon: #4a0e17;
            --maroon-dark: #2c060c;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --cream: #fcf9f2;
            --text-dark: #2b211e;
            --text-muted: #6e5d56;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--cream);
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.7;
        }

        h1, h2, h3, .royal-font {
            font-family: 'Cinzel Decorative', cursive;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Floating Petals Canvas */
        #petals-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(44, 6, 12, 0.72), rgba(74, 14, 23, 0.85)),
                        url('https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--cream);
            padding: 40px 20px;
            position: relative;
            border-bottom: 4px solid var(--gold);
        }

        .hero-frame {
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 50px 30px;
            max-width: 720px;
            width: 100%;
            background: rgba(44, 6, 12, 0.45);
            backdrop-filter: blur(4px);
            border-radius: 4px;
            position: relative;
        }

        .hero-frame::before {
            content: "॥ श्री गणेशाय नमः ॥";
            display: block;
            font-family: 'Cormorant Garamond', serif;
            color: var(--gold);
            font-size: 1.15rem;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-bottom: 15px;
        }

        .couple-title {
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            color: var(--gold);
            line-height: 1.2;
            margin: 10px 0;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .ampersand {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 2.2rem;
            color: var(--cream);
            margin: 5px 0;
        }

        .wedding-date-banner {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.4);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--gold-light);
        }

        .scroll-down {
            margin-top: 35px;
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* Section Containers */
        section {
            padding: 80px 20px;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .section-tag {
            font-size: 0.8rem;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--maroon);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .section-heading {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            color: var(--maroon);
            margin-bottom: 20px;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: var(--gold);
            margin: 0 auto 35px auto;
        }

        .invite-card {

            border: 1px solid rgba(212, 175, 55, 0.35);
            max-width: 780px;
            margin: 0 auto;
        }
